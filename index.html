<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميدان الاستجابة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: case rail on the reading side listing five levels, one working stage beside it that swaps between briefing, live simulation and debrief. */
/* Theme: dark pentest-lab console (terminal prompt, window-chrome panels, faint grid, cyan glow). Light variant behind the toggle. */
:root{
  --bg:#0A0E13; --surface:#0F151C; --surface2:#141C25; --ink:#D7E2EC; --muted:#7F92A4; --line:#1E2B37;
  --accent:#2BC4F0; --accent-ink:#03141C; --accent-soft:#0E2A38; --on-solid:#04101A;
  --ok:#3DDC97; --ok-soft:#0F2E22; --warn:#F2B84B; --warn-soft:#33270E; --bad:#FF6B6B; --bad-soft:#3A1717;
  --grid:rgba(43,196,240,.05); --glow:rgba(43,196,240,.35);
  --font:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F4F6F8; --ink:#14202B; --muted:#566676; --line:#D3DAE1;
  --accent:#0A6C96; --accent-ink:#FFFFFF; --accent-soft:#DCEEF6; --on-solid:#FFFFFF;
  --ok:#1B7F53; --ok-soft:#DDF1E7; --warn:#946004; --warn-soft:#FBEBCB; --bad:#B3321F; --bad-soft:#F9DDD7;
  --grid:rgba(10,108,150,.06); --glow:rgba(10,108,150,.25);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7}
.app{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ul{margin:0}
h1{font-size:28px;line-height:1.25;font-weight:700}
h2{font-size:21px;line-height:1.4;font-weight:600;text-wrap:balance}
h3{font-size:16px;font-weight:600}
ul{padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.kicker{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}
.score{display:flex;align-items:baseline;gap:8px;color:var(--muted)}
.score b{font-size:30px;color:var(--ink);font-weight:500;line-height:1}
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);gap:20px;align-items:start}
.rail{display:flex;flex-direction:column;gap:8px;min-width:0}
.lv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:start;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.lv:hover{border-color:var(--accent)}
.lv[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.lv .n{font-family:var(--mono);color:var(--accent);font-weight:500;font-size:18px}
.lv b{font-weight:600;display:block;line-height:1.4}
.lv .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}
.chip{font-size:12px;padding:1px 9px;border-radius:999px;font-weight:500;border:1px solid currentColor;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--surface2);color:var(--muted)}
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.timebox{display:flex;flex-direction:column;align-items:flex-end;color:var(--muted);font-size:12px}
.clock{font-family:var(--mono);font-size:32px;font-weight:500;line-height:1.1;direction:ltr;color:var(--ink)}
.clock.low{color:var(--bad)}
.prog{color:var(--muted);font-size:13px}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:var(--on-solid)}
.btn.ok{background:var(--ok);color:var(--on-solid)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.how div{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:4px}
/* email */
.email{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.meta .k{color:var(--muted);font-size:13px;min-width:64px}
.body{display:flex;flex-direction:column;gap:10px}
.hot{font:inherit;color:inherit;background:none;border:1px dashed var(--muted);border-radius:4px;padding:0 6px;cursor:pointer;text-align:start}
.hot:hover{border-color:var(--accent);background:var(--accent-soft)}
.hot.on{background:var(--warn-soft);border:1px solid var(--warn)}
.hot.miss{border:2px solid var(--bad);background:var(--bad-soft)}
.hot.fp{border:2px solid var(--warn);background:var(--warn-soft);text-decoration:line-through}
.hot.hit{border:2px solid var(--ok);background:var(--ok-soft)}
.real{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
/* feedback */
.fb{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.fb.good{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb.mid{border-color:var(--warn);background:var(--warn-soft)}
.st{font-size:12px;font-weight:600;padding:0 7px;border-radius:4px;margin-inline-end:6px;border:1px solid currentColor;white-space:nowrap}
.st.hit{color:var(--ok)} .st.miss{color:var(--bad)} .st.fp{color:var(--warn)} .st.neutral{color:var(--muted)}
.event{background:var(--bad-soft);border:1px solid var(--bad);border-radius:8px;padding:12px 14px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.log{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}
.log th,.log td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
.log th{background:var(--surface2);font-weight:600;color:var(--muted);font-size:12px}
.log td.m{font-family:var(--mono);direction:ltr;text-align:left;unicode-bidi:isolate}
.log tbody tr{cursor:pointer}
.log.static tbody tr{cursor:default}
.log tr.sel{background:var(--accent-soft)}
.log tr.hit{background:var(--ok-soft)}
.log tr.miss{background:var(--bad-soft)}
.log tr.fp{background:var(--warn-soft)}
.log .note{font-size:12.5px;min-width:200px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ev{margin:0;font-family:var(--mono);font-size:12.5px;direction:ltr;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre;line-height:1.9}
/* options */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;color:inherit;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.hit{border-color:var(--ok);background:var(--ok-soft)}
.opt.mid{border-color:var(--warn);background:var(--warn-soft)}
.opt.miss{border-color:var(--bad);background:var(--bad-soft)}
.opt.fp{border-color:var(--warn);background:var(--warn-soft)}
.opt[disabled]{cursor:default}
.opt .why{font-size:12.5px;color:var(--muted)}
.qblock{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
/* meters, roles */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.meter small{color:var(--muted)}
.meter b{font-family:var(--mono);font-size:22px;font-weight:500;direction:ltr;text-align:right}
.track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:var(--bad);width:0;transition:width .3s}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.feed{list-style:none;padding:0;font-size:13px;display:flex;flex-direction:column;gap:6px}
/* result */
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big b{font-size:56px;line-height:1;font-family:var(--mono);font-weight:500}
/* lab theme */
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.kicker{font-family:var(--mono);color:var(--accent)}
.kicker::before{content:'> ';color:var(--ok)}
.top .kicker::before{content:''}
.cur{display:inline-block;width:8px;height:1em;background:var(--accent);margin-inline-start:4px;vertical-align:-2px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.score b{color:var(--accent);text-shadow:0 0 14px var(--glow)}
.card{position:relative;padding-top:42px;border-radius:6px;box-shadow:0 14px 34px -22px var(--glow)}
.card::before{content:'';position:absolute;top:15px;left:16px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:16px 0 0 var(--warn),32px 0 0 var(--ok)}
.lv{border-radius:6px}
.lv[aria-current="true"]{box-shadow:0 0 0 1px var(--accent),0 0 18px -6px var(--glow)}
.clock{text-shadow:0 0 12px var(--glow)}
.clock.low{text-shadow:0 0 12px var(--bad)}
.btn{border-radius:4px;box-shadow:0 0 16px -6px var(--glow)}
.btn.sm{padding:6px 12px;font-size:13px}
.ev{color:var(--ok)}
.top .row{gap:16px}
/* animated scenes */
.scene{border:1px solid var(--line);border-radius:6px;background:var(--surface2);overflow:hidden}
.scene svg{display:block;width:100%;height:auto;max-height:180px;direction:ltr}
.scene .tb{height:3px;background:var(--accent);width:calc(var(--t,1)*100%);box-shadow:0 0 10px var(--glow)}
.scene.low .tb{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.scene *{animation-play-state:paused}
.scene.run *{animation-play-state:running}
.sc-link{stroke:var(--line);stroke-width:2;stroke-dasharray:4 6;fill:none}
.sc-ring{fill:none;stroke:var(--line);stroke-width:1.5}
.sc-node{fill:var(--surface);stroke:var(--line);stroke-width:2}
.sc-node.bad{stroke:var(--bad)}
.sc-node.acc{stroke:var(--accent)}
.sc-t{fill:var(--muted);font:14px var(--mono)}
.sc-bar{fill:var(--line)}
.sc-bar.hl{fill:var(--accent)}
.sc-dot{fill:var(--bad)}
.sc-dot.warn{fill:var(--warn)}
.sc-dot.ok{fill:var(--ok)}
.env{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.envf{fill:none;stroke:var(--accent);stroke-width:1.5}
.env.bad,.envf.bad{stroke:var(--bad)}
.trav{animation:trav 4.2s linear infinite}
@keyframes trav{0%{transform:translate(0,0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(var(--dx,0px),var(--dy,0px));opacity:0}}
.ring{fill:none;stroke:var(--bad);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(1.8);opacity:0}}
.flash{animation:flash 1.6s ease-in-out infinite}
@keyframes flash{50%{opacity:.2}}
.scan{fill:var(--accent);animation:scan 6s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(620px)}}
.cell{fill:var(--ok);opacity:.8;animation:infect 9s linear infinite;animation-delay:calc(var(--i)*.28s)}
@keyframes infect{0%,10%{fill:var(--ok)}20%,85%{fill:var(--bad)}100%{fill:var(--ok)}}
.spin{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{fill:var(--bad);animation:flash 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .lv{min-width:210px}
  h1{font-size:24px}
  .card{padding:16px;padding-top:40px}
  .big b{font-size:44px}
}
@media (prefers-reduced-motion:reduce){.fill{transition:none}.cur{animation:none}}
.vdlg{border:0;padding:0;background:transparent;width:min(960px,94vw);max-width:none;overflow:visible}
.vdlg::backdrop{background:rgba(3,6,10,.85)}
.vdlg video{display:block;width:100%;max-height:80vh;border-radius:8px;background:#000;border:1px solid var(--line)}
.vdlg-x{position:absolute;top:-46px;inset-inline-end:0;cursor:pointer;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:6px 16px}
</style>

</head>
<body>
<div class="app" dir="rtl" lang="ar">
  <header class="top">
    <div>
      <p class="kicker mono" dir="ltr">root@arena:~# ./incident-response<span class="cur"></span></p>
      <h1>ميدان الاستجابة</h1>
    </div>
    <div class="row"><button type="button" id="watchBtn" class="btn sm" aria-haspopup="dialog">▶ مشاهدة</button><div class="score"><small>مجموع النقاط</small><b id="total" class="mono">0</b><span class="mono">/ 550</span></div><button type="button" id="themeBtn" class="btn ghost sm"></button></div>
  </header>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="المستويات"></nav>
    <main id="stage" class="stage"></main>
  </div>
</div>

<script>
(()=>{
const KEY='incident-arena-v1';
let saved={};
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){saved={}}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};
const $=s=>document.querySelector(s);
const h=(t,a,...c)=>{
  const e=document.createElement(t);
  if(a)for(const k in a){
    const v=a[k];
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const x of c.flat(Infinity)){
    if(x==null||x===false)continue;
    e.append(x.nodeType?x:document.createTextNode(String(x)));
  }
  return e;
};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const rate=a=>a>=90?{t:'خبير استجابة',tone:'ok'}:a>=75?{t:'محترف',tone:'ok'}:a>=55?{t:'متمرّس',tone:'warn'}:{t:'يحتاج تدريبًا',tone:'bad'};

/* ---------- level data ---------- */
const LV=[
 {id:1,name:'اكتشاف التصيد',en:'Phishing Detection',tag:'مبتدئ',tone:'ok',time:240,run:L1,
  mission:'وصلت إلى صندوق بريد الأمن ثلاث رسائل أبلغ عنها موظفون. افحص كل رسالة، علّم العناصر المشبوهة داخلها، ثم احكم: تصيّد أم رسالة سليمة.',
  goals:['رصد مؤشرات التصيّد: النطاق والاستعجال والروابط والمرفقات','عدم اتهام الرسائل السليمة، فالبلاغ الكاذب يعطّل العمل','التمييز بين التصيّد العادي والاحتيال على المدير المالي'],
  lessons:['افحص النطاق الفعلي للمرسل لا الاسم الظاهر.','الاستعجال والسرية وتجاوز الإجراءات علامات تلاعب نفسي.','مرّر المؤشر على الرابط قبل الضغط، ثم أبلغ فريق الأمن.']},
 {id:2,name:'حادث شبكة',en:'Network Incident',tag:'متوسط',tone:'warn',time:300,run:L2,
  mission:'أطلق نظام المراقبة عشرة أحداث شبكية خلال نصف ساعة. حدّد الأحداث الخبيثة، ثم اختر إجراءات الاستجابة الصحيحة.',
  goals:['فصل الحركة الاعتيادية عن الهجوم','ربط الأحداث: تخمين ثم دخول ثم مسح ثم إشارة تحكم ثم تسريب','اختيار إجراءات تحتوي الحادث وتحفظ الأدلة'],
  lessons:['اربط الأحداث ببعضها بدل تقييم كل تنبيه وحده.','احتوِ أولًا، واحفظ الأدلة قبل أي إصلاح.','الحركة الكبيرة ليست خبيثة دائمًا: اعرف خط الأساس لشبكتك.']},
 {id:3,name:'التحقيق الجنائي الرقمي',en:'Digital Forensics',tag:'متوسط',tone:'warn',time:420,run:L3,
  mission:'يُشتبه بتسريب بيانات مالية من حاسوب الموظفة سلمى (WS-114). أمامك أربعة مصادر أدلة. أجب عن الأسئلة، ثم اختر ما يجوز إدراجه في تقرير الحادث.',
  goals:['قراءة السجلات وربطها زمنيًا لتحديد نقطة الدخول','التفريق بين ما يثبته الدليل وما هو تخمين','صياغة تقرير يقوم على الحقائق فقط'],
  lessons:['الدليل يسبق الاستنتاج: لا تسجّل نية أو نسبة بلا برهان.','سجّل التجزئة وسلسلة الحيازة لكل دليل.','رتّب الأحداث زمنيًا لتصل إلى السبب الجذري.']},
 {id:4,name:'مواجهة برمجية الفدية',en:'Ransomware Response',tag:'متقدم',tone:'bad',time:300,run:L4,
  mission:'03:12 فجرًا: ملاحظة فدية على خادم الملفات. كل ثانية تأخير تنتشر الإصابة إلى أجهزة جديدة. أمامك خمس مراحل قرار، من الاحتواء حتى الإبلاغ.',
  goals:['احتواء الانتشار قبل أي شيء آخر','تحديد النطاق الحقيقي للإصابة واستئصالها','استعادة آمنة من نسخ معزولة، وتواصل منضبط'],

  const TOTAL=120;
  let k=0,enc=14,down=0,dec=0,fin=false,contained=false;const per=[];
  const encV=h('b',{},''),fill=h('div',{class:'fill'}),downV=h('b',{},'0'),stV=h('span',{class:'chip bad'},'');
  const meters=h('div',{class:'meters'},
    h('div',{class:'meter'},h('small',{},'الأجهزة المشفّرة'),encV,h('div',{class:'track'},fill)),
    h('div',{class:'meter'},h('small',{},'التعطل التشغيلي (ساعات)'),downV),
    h('div',{class:'meter'},h('small',{},'حالة الانتشار'),stV));
  const area=h('div',{class:'col'});
  root.append(meters,area);
  const upd=()=>{
    encV.textContent=enc+' / '+TOTAL;fill.style.width=(enc/TOTAL*100)+'%';downV.textContent=String(down);
    stV.className='chip '+(contained?'ok':'bad');stV.textContent=contained?'تم احتواء الانتشار':'الانتشار مستمر';
  };
  upd();
  const iv=setInterval(()=>{if(!contained&&!fin){enc=Math.min(TOTAL,enc+3);upd()}},2000);
  api.cleanup(()=>clearInterval(iv));
  function step(){
    const ph=P[k];
    api.setProgress('المرحلة '+(k+1)+' من '+P.length+' — '+ph.n);
    const fb=h('div',{});
    const bs=shuffle(ph.o).map(o=>h('button',{type:'button',class:'opt',onclick:ev=>{
      if(fin||per[k]!=null)return;
      per[k]=o.p;dec+=o.p;enc=Math.min(TOTAL,enc+o.enc);down+=o.down;
      if(k===0)contained=true;
      upd();
      bs.forEach(b=>{b.disabled=true});
      ev.currentTarget.classList.add(o.p===20?'hit':o.p===10?'mid':'miss');
      const last=k===P.length-1;
      fb.replaceChildren(h('div',{class:'fb '+(o.p===20?'good':o.p===10?'mid':'bad')},
        h('p',{},o.fb),
        h('div',{class:'row'},h('button',{type:'button',class:'btn',onclick:()=>{if(last)done();else{k++;step()}}},last?'إنهاء الحادث':'المرحلة التالية'))));
    }},o.t));
    area.replaceChildren(h('section',{class:'card'},
      h('p',{class:'kicker'},'المرحلة '+(k+1)+' من '+P.length),
      h('h2',{},ph.n),
      h('div',{class:'event'},ph.ev),
      h('div',{class:'opts'},bs),fb));
  }
  function done(){
    if(fin)return;fin=true;clearInterval(iv);
    const acc=Math.round(0.8*dec+0.2*Math.max(0,100-enc/TOTAL*100));
    api.finish({acc:acc,note:'أجهزة مشفّرة '+enc+' من '+TOTAL+' · تعطل '+down+' ساعة',
      rows:P.map((p,j)=>({label:'المرحلة '+(j+1)+': '+p.n,pts:per[j]||0,max:20}))});
  }
  step();
  return ()=>done();
}

const THEME_KEY='incident-arena-theme';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  $('#themeBtn').textContent=t==='dark'?'الوضع الفاتح':'الوضع الداكن';
}
let theme='dark';
try{theme=localStorage.getItem(THEME_KEY)==='light'?'light':'dark'}catch(e){}
applyTheme(theme);
$('#themeBtn').addEventListener('click',()=>{
  theme=theme==='dark'?'light':'dark';applyTheme(theme);
  try{localStorage.setItem(THEME_KEY,theme)}catch(e){}
});

home();
